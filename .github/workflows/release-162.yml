name: Verify and publish signed Octane 1.2.62 NativeDll lobby robustness
on:
  push:
    branches: [main, codex/native-robustness-162]
    paths:
      - 'transport162/**'
      - '.github/scripts/*162*'
      - '.github/workflows/release-162.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: octane-public-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'begosik/OctaneLauncher' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/native-robustness-162')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reconstruct and authenticate the signed FPS1.0.36 launcher with retained XInput isolation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.2.57 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.57_Players_Compact.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Public baseline download failed' }
          python .github/scripts/assemble_162.py transport162/1.2.62 received
          if ($LASTEXITCODE -ne 0) { throw 'Signed public package verification failed' }
          python .github/scripts/extract_lobby162.py RA3Octane_1.2.57_Players_Compact.zip received/RA3Octane_1.2.62_Players_Compact.zip transport162/1.2.62/manifest.json native-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Public fixture extraction failed' }
          python .github/scripts/verify_fps_profile162.py RA3Octane_1.2.57_Players_Compact.zip received/RA3Octane_1.2.62_Players_Compact.zip transport162/1.2.62/manifest.json transport162/1.2.62/runtime-layout.json profile-results/fingerprint.json
          if ($LASTEXITCODE -ne 0) { throw 'Supplied FPS profile fingerprint verification failed' }
          python .github/scripts/extract_observers162.py RA3Octane_1.2.57_Players_Compact.zip received/RA3Octane_1.2.62_Players_Compact.zip transport162/1.2.62/manifest.json transport162/1.2.62/runtime-layout.json observer-fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Embedded production observer verification failed' }
      - name: Verify reviewed Native162 network/runtime changes and preserved packet limits
        shell: pwsh
        run: .github/scripts/network162.ps1 -Baseline RA3Octane_1.2.57_Players_Compact.zip -GamePath native-fixture/canonical.game -NativePath native-fixture/patched.dll -Output network-results
      - name: Verify NativeDll lobby robustness and caller-token launch manifest
        shell: pwsh
        run: .github/scripts/autofix_windows162.ps1 -Transport transport162/autofix-test -Package received/RA3Octane_1.2.62_Players_Compact.zip -Output autofix-results
      - name: Verify styled FPS selector, VSync and actual session bytes
        shell: pwsh
        run: .github/scripts/fps_slider162.ps1 -Package received/RA3Octane_1.2.62_Players_Compact.zip -Layout transport162/1.2.62/runtime-layout.json -Output fps-results
      - name: Verify styled camera slider, persistence and exact selected runtime speed
        shell: pwsh
        run: .github/scripts/camera_slider162.ps1 -Package received/RA3Octane_1.2.62_Players_Compact.zip -Layout transport162/1.2.62/runtime-layout.json -Output camera-results
      - name: Prove legacy XInput DLL never loads and disconnected stub preserves ABI
        shell: pwsh
        run: .github/scripts/xinput162.ps1 -Package received/RA3Octane_1.2.62_Players_Compact.zip -Layout transport162/1.2.62/runtime-layout.json -Output xinput-results
      - name: Preserve Community detection, config order and mod exclusion
        shell: pwsh
        run: .github/scripts/community_142.ps1 -Package received/RA3Octane_1.2.62_Players_Compact.zip -Output community-results
      - name: Native launcher, update worker and rollback
        shell: pwsh
        run: .github/scripts/windows_162.ps1 -Package received/RA3Octane_1.2.62_Players_Compact.zip -Baseline RA3Octane_1.2.57_Players_Compact.zip -Output native-results
      - name: Verify installed BattleNet patching, late frontend startup and independent recovery
        shell: pwsh
        run: .github/scripts/battlenet_162.ps1 -Package received/RA3Octane_1.2.62_Players_Compact.zip -PatchedFixture native-fixture/patched.dll -Output bn-results
      - name: Prove mapped NativeDll install and restore, crash-state recovery and exact access errors
        shell: pwsh
        run: .github/scripts/bn_swap162.ps1 -Package received/RA3Octane_1.2.62_Players_Compact.zip -Baseline RA3Octane_1.2.57_Players_Compact.zip -PatchedFixture native-fixture/patched.dll -Output bn-swap-results
      - name: Verify Options recovery with actual Windows file and process APIs
        shell: pwsh
        run: .github/scripts/options_windows162.ps1 -Transport transport151/options-test -Output options-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: octane-162-native-evidence
          path: |
            received
            fps-results
            camera-results
            profile-results
            xinput-results
            observer-fixtures/observers.json
            community-results
            native-results
            bn-results
            bn-swap-results
            options-results
            network-results
            autofix-results
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: verify
    if: github.repository == 'begosik/OctaneLauncher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish exact verified signed archive with empty description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: begosik/OctaneLauncher
        run: |
          gh release download v1.2.57 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.57_Players_Compact.zip --clobber
          python3 .github/scripts/assemble_162.py transport162/1.2.62 published publish
          gh api repos/begosik/OctaneLauncher/releases/latest > published/latest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: octane-162-publication-receipt
          path: published
          retention-days: 7
          if-no-files-found: error
