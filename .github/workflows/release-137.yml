name: Verify and publish signed Octane 1.2.37
on:
  push:
    branches: [main]
    paths:
      - 'transport137/**'
      - '.github/scripts/windows_137.ps1'
      - '.github/workflows/release-137.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: octane-public-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'begosik/OctaneLauncher' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reconstruct and verify the exact signed public package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.2.36 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.36_Players_Compact.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Public baseline download failed' }
          python .github/scripts/assemble_signed_v3.py transport137/1.2.37 received
          if ($LASTEXITCODE -ne 0) { throw 'Signed public package verification failed' }
      - name: Native launcher, worker, rollback and cleanup checks
        shell: pwsh
        run: .github/scripts/windows_137.ps1 -Package received/RA3Octane_1.2.37_Players_Compact.zip -Baseline RA3Octane_1.2.36_Players_Compact.zip -Output native-results
      - name: Preserve the automatic update notice
        shell: pwsh
        run: .github/scripts/windows_137.ps1 -Mode notice -Package received/RA3Octane_1.2.37_Players_Compact.zip -Baseline RA3Octane_1.2.36_Players_Compact.zip -Output notice-results
      - name: Preserve the launcher-written 4GB session
        shell: pwsh
        run: .github/scripts/memory_136.ps1 -Package received/RA3Octane_1.2.37_Players_Compact.zip -Output memory-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: octane-137-native-evidence
          path: |
            received
            native-results
            notice-results
            memory-results
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: verify
    if: github.repository == 'begosik/OctaneLauncher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish the verified runtime without release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: begosik/OctaneLauncher
        run: |
          gh release download v1.2.36 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.36_Players_Compact.zip --clobber
          python3 .github/scripts/assemble_signed_v3.py transport137/1.2.37 published publish
          gh api repos/begosik/OctaneLauncher/releases/latest > published/latest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: octane-137-publication-receipt
          path: published
          retention-days: 3
          if-no-files-found: error
  http-update:
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download public baseline and independent reference
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.2.36 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.36_Players_Compact.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
          gh release download v1.2.37 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.37_Players_Compact.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Reference download failed' }
          if ((Get-FileHash RA3Octane_1.2.37_Players_Compact.zip).Hash.ToLowerInvariant() -ne 'db230c8e1ef6f2488437b37527ef87140858829e1831e13d0bc21b9fb26f950a') { throw 'Reference hash mismatch' }
      - name: Actual WinHTTP upgrade from unmodified 1.2.36
        shell: pwsh
        run: .github/scripts/windows_137.ps1 -Mode http -Package RA3Octane_1.2.37_Players_Compact.zip -Baseline RA3Octane_1.2.36_Players_Compact.zip -Output http-results
      - name: Capture public test support
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path receipt-support | Out-Null
          Copy-Item -Recurse -Force .github receipt-support
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: octane-137-http-evidence
          path: |
            http-results
            receipt-support
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
