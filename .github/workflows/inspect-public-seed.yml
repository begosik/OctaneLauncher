name: Inspect existing public package transport
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-public-seed.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public download without executing it
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,io,json,struct,urllib.request,zipfile
          url='https://drive.usercontent.google.com/download?id=1G_JVP6mddY5uAPEMdq1MiUx0v6v3s27E&export=download&confirm=t'
          try:
              with urllib.request.urlopen(url,timeout=30) as response:
                  data=response.read(128*1024*1024+1)
              if len(data)>128*1024*1024:raise ValueError('Public download exceeds size limit')
              if not zipfile.is_zipfile(io.BytesIO(data)):
                  print('PUBLIC_SEED: no downloadable ZIP; no file was published')
              else:
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      out={'archive_bytes':len(data),'archive_sha256':hashlib.sha256(data).hexdigest(),'files':[]}
                      for item in archive.infolist():
                          name=item.filename.rsplit('/',1)[-1]
                          if name not in ('RA3Octane.exe','patches.octpack','release.oct'):continue
                          if item.file_size>128*1024*1024:raise ValueError('Entry exceeds limit')
                          b=archive.read(item)
                          record={'name':name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
                          if name=='release.oct' and b[:8] in (b'OCTREL01',b'OCTREL02'):record['version']=list(struct.unpack_from('<3I',b,8))
                          out['files'].append(record)
                      print('PUBLIC_SEED:',json.dumps(out))
          except Exception as exc:
              print('PUBLIC_SEED: download unavailable:',type(exc).__name__,str(exc)[:200])
          PY
