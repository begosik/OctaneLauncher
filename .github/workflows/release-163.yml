name: Verify and publish signed Octane 1.2.63 EngineLab and renderer selection
on:
  push:
    branches: [main, codex/enginelab062-renderer-163]
    paths:
      - 'transport163/**'
      - '.github/scripts/*163*'
      - '.github/workflows/release-163.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: octane-public-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'begosik/OctaneLauncher' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/enginelab062-renderer-163')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Authenticate optimized163 and reconstruct the retained162 C7 regression fixture
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.2.57 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.57_Players_Compact.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Public baseline download failed' }
          python .github/scripts/assemble_163.py transport163/1.2.63 received
          if ($LASTEXITCODE -ne 0) { throw 'Signed optimized163 package verification failed' }
          python .github/scripts/assemble_162.py transport162/1.2.62 retained162
          if ($LASTEXITCODE -ne 0) { throw 'Retained signed162 fixture verification failed' }
          python .github/scripts/extract_lobby162.py RA3Octane_1.2.57_Players_Compact.zip retained162/RA3Octane_1.2.62_Players_Compact.zip transport162/1.2.62/manifest.json native-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Retained C7/F1 fixture extraction failed' }
          python .github/scripts/extract_observers163.py RA3Octane_1.2.57_Players_Compact.zip received/RA3Octane_1.2.63_Players_Compact.zip transport163/1.2.63/manifest.json transport163/1.2.63/runtime-layout.json observer-fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Embedded production observer verification failed' }
      - name: Verify reviewed Native162 network/runtime changes and preserved packet limits
        shell: pwsh
        run: .github/scripts/network162.ps1 -Baseline RA3Octane_1.2.57_Players_Compact.zip -GamePath native-fixture/canonical.game -NativePath native-fixture/patched.dll -Output network-results
      - name: Verify retained automatic fixes and the actual163 caller-token manifest
        shell: pwsh
        run: .github/scripts/autofix_windows163.ps1 -Transport transport162/autofix-test -Package received/RA3Octane_1.2.63_Players_Compact.zip -Output autofix-results
      - name: Verify optimized profile, styled FPS/camera/renderer and prepared session bytes
        shell: pwsh
        run: .github/scripts/fps_renderer163.ps1 -Package received/RA3Octane_1.2.63_Players_Compact.zip -Baseline RA3Octane_1.2.57_Players_Compact.zip -Manifest transport163/1.2.63/manifest.json -Layout transport163/1.2.63/runtime-layout.json -Output fps-renderer-results
      - name: Prove legacy XInput DLL never loads and disconnected stub preserves ABI
        shell: pwsh
        run: .github/scripts/xinput163.ps1 -Package received/RA3Octane_1.2.63_Players_Compact.zip -Layout transport163/1.2.63/runtime-layout.json -Output xinput-results
      - name: Preserve Community detection, config order and mod exclusion
        shell: pwsh
        run: .github/scripts/community_163.ps1 -Package received/RA3Octane_1.2.63_Players_Compact.zip -Output community-results
      - name: Native launcher, update worker and rollback
        shell: pwsh
        run: .github/scripts/windows_163.ps1 -Package received/RA3Octane_1.2.63_Players_Compact.zip -Baseline RA3Octane_1.2.57_Players_Compact.zip -Output native-results
      - name: Verify installed BattleNet patching, late frontend startup and independent recovery
        shell: pwsh
        run: .github/scripts/battlenet_163.ps1 -Package received/RA3Octane_1.2.63_Players_Compact.zip -PatchedFixture native-fixture/patched.dll -Output bn-results
      - name: Prove mapped NativeDll install and restore, crash-state recovery and exact access errors
        shell: pwsh
        run: .github/scripts/bn_swap163.ps1 -Package received/RA3Octane_1.2.63_Players_Compact.zip -Baseline RA3Octane_1.2.57_Players_Compact.zip -PatchedFixture native-fixture/patched.dll -Output bn-swap-results
      - name: Verify Options recovery with actual Windows file and process APIs
        shell: pwsh
        run: .github/scripts/options_windows163.ps1 -Transport transport151/options-test -Output options-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: octane-163-engine-renderer-evidence
          path: |
            received
            fps-renderer-results
            xinput-results
            observer-fixtures/observers.json
            community-results
            native-results
            bn-results
            bn-swap-results
            options-results
            network-results
            autofix-results
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: verify
    if: github.repository == 'begosik/OctaneLauncher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish exact verified signed archive with empty description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: begosik/OctaneLauncher
        run: |
          gh release download v1.2.57 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.57_Players_Compact.zip --clobber
          python3 .github/scripts/assemble_163.py transport163/1.2.63 published publish
          gh api repos/begosik/OctaneLauncher/releases/latest > published/latest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: octane-163-publication-receipt
          path: published
          retention-days: 7
          if-no-files-found: error
