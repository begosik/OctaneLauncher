name: Verify and publish complete signed public package
on:
  push:
    branches: [main]
    paths:
      - 'transport-v2/**'
      - '.github/scripts/assemble_signed_v2.py'
      - '.github/scripts/assemble_signed_v3.py'
      - '.github/scripts/windows_public_test.ps1'
      - '.github/scripts/windows_public_ready.ps1'
      - '.github/workflows/verify-public-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: octane-public-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'begosik/OctaneLauncher' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reconstruct and verify the complete signed public archive
        run: python .github/scripts/assemble_signed_v3.py transport-v2/1.2.33 received
      - name: Native Windows launcher and updater checks
        shell: pwsh
        run: .github/scripts/windows_public_ready.ps1 -Package received/RA3Octane_1.2.33_Players_Compact.zip -Baseline RA3Octane_1.2.32_Players_Compact.zip -Output native-results
      - name: Public transport receipt and native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: octane-public-v2-receipt
          path: |
            transport-v2/1.2.33
            received
            native-results
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: verify
    if: github.repository == 'begosik/OctaneLauncher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish only the verified signed files and verify downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: begosik/OctaneLauncher
        run: python3 .github/scripts/assemble_signed_v3.py transport-v2/1.2.33 published publish
      - name: Preserve empty descriptions without modifying other releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: begosik/OctaneLauncher
        run: python3 .github/scripts/clear_release_descriptions.py
      - name: Published download receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: octane-published-receipt
          path: published
          retention-days: 3
          if-no-files-found: error
