name: Check update workspace
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-update-workspace.yml'
      - '.github/scripts/update_smoke_test.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'begosik/OctaneLauncher'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test public launcher update and retained files
        shell: pwsh
        run: python .github/scripts/update_smoke_test.py
