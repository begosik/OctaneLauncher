name: Verify and publish signed Octane 1.2.38
on:
  push:
    branches: [main]
    paths:
      - 'transport138/**'
      - '.github/workflows/release-138.yml'
      - '.github/scripts/unpack_support138.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: octane-public-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'begosik/OctaneLauncher' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Unpack hash-bound public acceptance support
        shell: pwsh
        run: |
          python .github/scripts/unpack_support138.py
          if ($LASTEXITCODE -ne 0) { throw 'Public support identity mismatch' }
      - name: Reconstruct and verify the exact signed public archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.2.37 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.37_Players_Compact.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
          python .github/scripts/assemble_138.py transport138/1.2.38 received
          if ($LASTEXITCODE -ne 0) { throw 'Signed runtime identity mismatch' }
      - name: Native UI, worker, interruption recovery and cleanup
        shell: pwsh
        run: .github/scripts/windows_138.ps1 -Package received/RA3Octane_1.2.38_Players_Compact.zip -Baseline RA3Octane_1.2.37_Players_Compact.zip -Output native-results
      - name: Persistent BattleNet and truthful Active or Original status
        shell: pwsh
        run: .github/scripts/bnet_138.ps1 -Package received/RA3Octane_1.2.38_Players_Compact.zip -Baseline RA3Octane_1.2.37_Players_Compact.zip -Output bnet-results
      - name: Preserve the automatic update popup
        shell: pwsh
        run: .github/scripts/windows_138.ps1 -Mode notice -Package received/RA3Octane_1.2.38_Players_Compact.zip -Baseline RA3Octane_1.2.37_Players_Compact.zip -Output notice-results
      - name: Preserve the actual launcher-written 4GB session
        shell: pwsh
        run: .github/scripts/memory_136.ps1 -Package received/RA3Octane_1.2.38_Players_Compact.zip -Output memory-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: octane-138-native-evidence
          path: |
            received
            native-results
            bnet-results
            notice-results
            memory-results
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: verify
    if: github.repository == 'begosik/OctaneLauncher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reconstruct the verified archive, publish empty description and read back
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: begosik/OctaneLauncher
        run: |
          python3 .github/scripts/unpack_support138.py
          python3 -c "import json,subprocess; m=json.loads(subprocess.check_output(['gh','api','repos/begosik/OctaneLauncher/releases/latest'])); assert m['tag_name'] in ('v1.2.37','v1.2.38'), 'A different newer release already exists'"
          gh release download v1.2.37 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.37_Players_Compact.zip --clobber
          python3 .github/scripts/assemble_138.py transport138/1.2.38 published publish
          gh api repos/begosik/OctaneLauncher/releases/latest > published/latest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: octane-138-publication-receipt
          path: published
          retention-days: 3
          if-no-files-found: error
  http-update:
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download public baseline and independent published reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python .github/scripts/unpack_support138.py
          if ($LASTEXITCODE -ne 0) { throw 'Support identity mismatch' }
          gh release download v1.2.37 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.37_Players_Compact.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
          gh release download v1.2.38 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.38_Players_Compact.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Published download failed' }
          if ((Get-FileHash RA3Octane_1.2.38_Players_Compact.zip).Hash.ToLowerInvariant() -ne '5645d429b5b17884e367282bab4f03473a56cb1c31432dbbb09cae6482c16059') { throw 'Published bytes differ' }
      - name: Read the unchanged authenticated public BattleNet payload
        shell: pwsh
        run: .github/scripts/bnet_138.ps1 -Mode export -Package RA3Octane_1.2.38_Players_Compact.zip -Baseline RA3Octane_1.2.37_Players_Compact.zip -Output fixture
      - name: Actual WinHTTP self-update with BattleNet enabled
        shell: pwsh
        run: .github/scripts/http_bnet_138.ps1 -Package RA3Octane_1.2.38_Players_Compact.zip -Baseline RA3Octane_1.2.37_Players_Compact.zip -Output http-on -Fixture fixture/signed-NativeDll.dll -Preference 1
      - name: Actual WinHTTP self-update keeps explicit BattleNet OFF
        shell: pwsh
        run: .github/scripts/http_bnet_138.ps1 -Package RA3Octane_1.2.38_Players_Compact.zip -Baseline RA3Octane_1.2.37_Players_Compact.zip -Output http-off -Fixture fixture/signed-NativeDll.dll -Preference 0
      - name: Capture exact public acceptance support
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path support-receipt | Out-Null
          Copy-Item -Recurse -Force .github support-receipt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: octane-138-http-evidence
          path: |
            http-on
            http-off
            support-receipt
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
