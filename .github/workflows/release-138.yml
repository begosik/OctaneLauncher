name: Verify signed Octane 1.2.38
on:
  push:
    branches: [main]
    paths:
      - 'transport138/**'
      - '.github/workflows/release-138.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: octane-public-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'begosik/OctaneLauncher' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Unpack hash-bound public acceptance support
        shell: pwsh
        run: |
          @'
          import base64,hashlib,io,zipfile
          from pathlib import Path
          r=Path('transport138/1.2.38');b=base64.b64decode((r/'support.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(b).hexdigest()=='f768a1e0389a7624afb0c44e2e9a00eaab17c1d9298b19cb640569ffa809c5a0'
          names={'assemble_138.py','layout138.json','bnet_138.ps1','windows_138.ps1','http_bnet_138.ps1'}
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              assert set(z.namelist())==names and len(z.infolist())==len(names)
              assert sum(i.file_size for i in z.infolist())<100000
              for n in names:(Path('.github/scripts')/n).write_bytes(z.read(n))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Public support identity mismatch' }
      - name: Reconstruct and verify the exact signed public archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.2.37 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.37_Players_Compact.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
          python .github/scripts/assemble_138.py transport138/1.2.38 received
          if ($LASTEXITCODE -ne 0) { throw 'Signed runtime identity mismatch' }
      - name: Native UI, worker, interruption recovery and cleanup
        shell: pwsh
        run: .github/scripts/windows_138.ps1 -Package received/RA3Octane_1.2.38_Players_Compact.zip -Baseline RA3Octane_1.2.37_Players_Compact.zip -Output native-results
      - name: Persistent BattleNet and truthful Active or Original status
        shell: pwsh
        run: .github/scripts/bnet_138.ps1 -Package received/RA3Octane_1.2.38_Players_Compact.zip -Baseline RA3Octane_1.2.37_Players_Compact.zip -Output bnet-results
      - name: Preserve the automatic update popup
        shell: pwsh
        run: .github/scripts/windows_138.ps1 -Mode notice -Package received/RA3Octane_1.2.38_Players_Compact.zip -Baseline RA3Octane_1.2.37_Players_Compact.zip -Output notice-results
      - name: Preserve the actual launcher-written 4GB session
        shell: pwsh
        run: .github/scripts/memory_136.ps1 -Package received/RA3Octane_1.2.38_Players_Compact.zip -Output memory-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: octane-138-native-evidence
          path: |
            received
            native-results
            bnet-results
            notice-results
            memory-results
          retention-days: 3
          if-no-files-found: error
