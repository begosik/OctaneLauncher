name: Inspect public runtime map coordinates
on:
  push:
    branches: [investigate-large-map-coordinates]
    paths:
      - '.github/scripts/inspect_large_map_coordinates.py'
      - '.github/scripts/inspect_map_followup.py'
      - '.github/workflows/inspect-map-coordinates.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Obtain the existing public runtime only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.2.40 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.40_Players_Compact.zip --clobber
          gh release download v1.2.41 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.41_Players_Compact.zip --clobber
          python3 -m pip install --disable-pip-version-check pefile==2024.8.26 capstone==5.0.3 unicorn==2.1.2
      - name: Inspect coordinate and spatial-index routines without executing the game
        run: python3 .github/scripts/inspect_large_map_coordinates.py
      - name: Follow-up bounded analysis
        run: |
          if [ -f .github/scripts/inspect_map_followup.py ]; then python3 .github/scripts/inspect_map_followup.py; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: map-coordinate-inspection-text
          path: inspection
          retention-days: 3
          if-no-files-found: warn
