name: Verify and publish signed Octane 1.2.44 60FPS v2 1.0.1
on:
  push:
    branches: [main]
    paths:
      - 'transport144/**'
      - '.github/scripts/*144*'
      - '.github/workflows/release-144.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: octane-public-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'begosik/OctaneLauncher' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reconstruct and verify signed 60FPS v2 1.0.1 package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.2.43 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.43_Players_Compact.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Public baseline download failed' }
          python .github/scripts/assemble_144.py transport144/1.2.44 received
          if ($LASTEXITCODE -ne 0) { throw 'Signed public package verification failed' }
          python .github/scripts/extract_native141.py RA3Octane_1.2.43_Players_Compact.zip received/RA3Octane_1.2.44_Players_Compact.zip transport144/1.2.44/manifest.json native-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Public fixture extraction failed' }
          python .github/scripts/verify_fps_profile144.py RA3Octane_1.2.43_Players_Compact.zip received/RA3Octane_1.2.44_Players_Compact.zip transport144/1.2.44/manifest.json transport144/1.2.44/runtime-layout.json profile-results/fingerprint.json
          if ($LASTEXITCODE -ne 0) { throw 'Supplied FPS profile fingerprint verification failed' }
      - name: Final launcher 60FPS v2 1.0.1 hooks, mode, 4GB and bound runtime logging
        shell: pwsh
        run: .github/scripts/fps_v2_144.ps1 -Package received/RA3Octane_1.2.44_Players_Compact.zip -Layout transport144/1.2.44/runtime-layout.json -Output fps-results
      - name: Preserve Community detection, config order and mod exclusion
        shell: pwsh
        run: .github/scripts/community_142.ps1 -Package received/RA3Octane_1.2.44_Players_Compact.zip -Output community-results
      - name: Native launcher, update worker and rollback
        shell: pwsh
        run: .github/scripts/windows_144.ps1 -Package received/RA3Octane_1.2.44_Players_Compact.zip -Baseline RA3Octane_1.2.43_Players_Compact.zip -Output native-results
      - name: Preserve independent BattleNet recovery
        shell: pwsh
        run: .github/scripts/battlenet_141.ps1 -Package received/RA3Octane_1.2.44_Players_Compact.zip -PatchedFixture native-fixture/patched.dll -Output bn-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: octane-144-native-evidence
          path: |
            received
            fps-results
            profile-results
            community-results
            native-results
            bn-results
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: verify
    if: github.repository == 'begosik/OctaneLauncher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish exact verified signed archive with empty description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: begosik/OctaneLauncher
        run: |
          gh release download v1.2.43 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.43_Players_Compact.zip --clobber
          python3 .github/scripts/assemble_144.py transport144/1.2.44 published publish
          gh api repos/begosik/OctaneLauncher/releases/latest > published/latest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: octane-144-publication-receipt
          path: published
          retention-days: 7
          if-no-files-found: error
