name: Real HTTP update to 1.2.34
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/http_update_134.ps1'
      - '.github/workflows/http-update-134.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http-update:
    if: github.repository == 'begosik/OctaneLauncher' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download the public reference for byte comparison only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download v1.2.34 --repo begosik/OctaneLauncher --pattern RA3Octane_1.2.34_Players_Compact.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Reference download failed' }
          if ((Get-FileHash RA3Octane_1.2.34_Players_Compact.zip).Hash.ToLowerInvariant() -ne 'd3206d34589b7c2a558549fcc111f454a66eb91b15567a3ea05f976cf214e9e8') { throw 'Reference identity mismatch' }
      - name: Real signed-manifest check, confirmation, WinHTTP download, replacement and restart
        shell: pwsh
        run: .github/scripts/http_update_134.ps1 -Package RA3Octane_1.2.34_Players_Compact.zip -Baseline RA3Octane_1.2.32_Players_Compact.zip -Output http-results
      - name: Collect public test scripts and evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path receipt-support | Out-Null
          Copy-Item -Recurse -Force .github receipt-support
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: octane-134-http-evidence
          path: |
            http-results
            receipt-support
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
