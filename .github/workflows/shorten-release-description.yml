name: Refresh public release description

on:
  push:
    branches: [main]
    paths: ['.github/workflows/shorten-release-description.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'begosik/OctaneLauncher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Update description without changing download files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          root = 'https://api.github.com/repos/begosik/OctaneLauncher/releases'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Octane-public-description'}
          def request(url, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers=headers, method='GET' if payload is None else 'PATCH')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          old = request(root + '/tags/v1.2.31')
          assert old['tag_name'] == 'v1.2.31' and not old['draft']
          before = [(a['id'], a['name'], a['size'], a.get('digest')) for a in old['assets']]
          body = '# RA3 Octane 1.2.31\n\n- Neutral launcher interface.\n- GitHub updates.\n- Confirmation before restoring the original BattleNet library.\n- Smaller download.\n\nRequires Red Alert 3 v1.12. Extract the complete ZIP and run RA3Octane.exe. All multiplayer participants should use the same version.\n\nGameplay is unchanged from 1.2.30. The reported building-effect flicker and six-player ESC panel with mods are not fixed in this release.\n'
          result = request(root + '/' + str(old['id']), {'body': body})
          check = request(root + '/tags/v1.2.31')
          after = [(a['id'], a['name'], a['size'], a.get('digest')) for a in check['assets']]
          assert check['body'] == body and before == after
          print('Public description updated. Download files unchanged.')
          PY
